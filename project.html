  <script>
    (function () {
      var choice = '', season = '';
      try { choice = localStorage.getItem('myweb_theme_v1') || ''; season = localStorage.getItem('myweb_season_v1') || ''; } catch (error) { /* Preferences are optional. */ }
      var now = new Date(), hour = now.getHours(), month = now.getMonth() + 1;
      var mode = choice === 'paper' || choice === 'night' ? choice : (hour >= 20 || hour < 6 ? 'night' : 'paper');
      var autoSeason = month >= 3 && month <= 5 ? 'spring' : month >= 6 && month <= 8 ? 'summer' : month >= 9 && month <= 11 ? 'autumn' : 'winter';
      if (['spring', 'summer', 'autumn', 'winter'].indexOf(season) === -1) season = autoSeason;
      var root = document.documentElement;
      root.dataset.theme = mode; root.dataset.season = season;
      root.style.colorScheme = mode === 'night' ? 'dark' : 'light';
      var colors = { spring: '#f7f8f3', summer: '#faf7f0', autumn: '#faf5ec', winter: '#f5f6f7' };
      var color = document.querySelector('meta[name="theme-color"]');
      if (color) color.content = mode === 'night' ? '#1e2420' : colors[season];
    })();
  </script>
