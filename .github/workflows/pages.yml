name: Publish personal website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - name: Install React and Vite dependencies
        run: npm ci --ignore-scripts
      - name: Check local prompt data rules
        run: npm run check
      - name: Checkout pinned Prompt Optimizer source
        uses: actions/checkout@v6
        with:
          repository: linshenkx/prompt-optimizer
          ref: fe72bb1f6e6ff970658b67b75dc630ff1adcfc55
          path: .tmp/prompt-optimizer-source
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: '10.6.1'
          run_install: false
      - name: Install optimizer web dependencies
        working-directory: .tmp/prompt-optimizer-source
        run: pnpm --filter '@prompt-optimizer/web...' install --frozen-lockfile --ignore-scripts
      - name: Build optimizer without preset model credentials
        run: node scripts/build-optimizer.mjs
      - name: Prepare runtime files only
        id: build
        run: node scripts/build-pages.mjs --site-url=https://zlonglab.github.io/MyWeb/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.build.outputs.directory }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
